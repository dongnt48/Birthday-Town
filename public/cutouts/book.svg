<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="book_glow" cx="200" cy="220" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
    <filter id="b_blur">
      <feGaussianBlur stdDeviation="15" />
    </filter>
  </defs>
  <circle cx="200" cy="220" r="160" fill="url(#book_glow)" filter="url(#b_blur)" />
  <!-- Open Book Base -->
  <path d="M100 240 Q 200 255, 200 270 Q 200 255, 300 240 L 300 210 Q 200 225, 200 240 Q 200 225, 100 210 Z" fill="#3f2e1e" />
  <!-- Left Page -->
  <path d="M105 208 Q 195 220, 195 238 L 195 190 Q 150 178, 105 180 Z" fill="#fef3c7" />
  <!-- Right Page -->
  <path d="M295 208 Q 205 220, 205 238 L 205 190 Q 250 178, 295 180 Z" fill="#fffbeb" />
  <!-- Text lines on page -->
  <line x1="120" y1="195" x2="180" y2="200" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="120" y1="205" x2="175" y2="210" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="120" y1="215" x2="165" y2="220" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="220" y1="200" x2="280" y2="195" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <line x1="225" y1="210" x2="280" y2="205" stroke="#b45309" stroke-width="1.5" stroke-linecap="round" />
  <!-- Coffee Cup behind -->
  <ellipse cx="280" cy="155" rx="30" ry="12" fill="#292524" />
  <path d="M255 155 C 255 185, 305 185, 305 155 Z" fill="#44403c" stroke="#d97706" stroke-width="1.5" />
  <ellipse cx="280" cy="155" rx="22" ry="8" fill="#78350f" />
  <!-- Steam from coffee -->
  <path d="M275 140 Q 270 125, 278 115" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M285 142 Q 290 128, 284 118" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round" />
</svg>
