<svg width="800" height="1000" viewBox="0 0 800 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="m1_sky" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141926" />
      <stop offset="45%" stop-color="#2a2538" />
      <stop offset="75%" stop-color="#4d3238" />
      <stop offset="100%" stop-color="#1f1822" />
    </linearGradient>
    <radialGradient id="m1_sun" cx="400" cy="520" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd580" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#f5a65b" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#b45362" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#141926" stop-opacity="0" />
    </radialGradient>
    <filter id="m1_blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#m1_sky)" />
  <circle cx="400" cy="520" r="280" fill="url(#m1_sun)" filter="url(#m1_blur)" />
  <circle cx="400" cy="480" r="90" fill="#fff5da" fill-opacity="0.9" filter="url(#m1_blur)" />
  <!-- Silhouette mountains/horizon -->
  <path d="M0 650 Q 200 620, 400 660 T 800 640 L 800 1000 L 0 1000 Z" fill="#0f1118" />
  <path d="M0 720 Q 300 680, 550 730 T 800 710 L 800 1000 L 0 1000 Z" fill="#08090d" />
  <!-- Floating golden dust stars in memory -->
  <circle cx="280" cy="380" r="2.5" fill="#fde68a" fill-opacity="0.8" />
  <circle cx="520" cy="320" r="3" fill="#fde68a" fill-opacity="0.9" />
  <circle cx="440" cy="240" r="2" fill="#ffffff" fill-opacity="0.7" />
  <circle cx="160" cy="460" r="1.5" fill="#fde68a" fill-opacity="0.6" />
  <!-- Cinematic frame border -->
  <rect x="24" y="24" width="752" height="952" rx="16" stroke="rgba(245, 215, 127, 0.25)" stroke-width="1.5" />
